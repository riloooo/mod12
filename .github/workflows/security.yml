name: security
on: [push, pull_request]
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with: { fetch-depth: 0 }
      # GATE
      - name: Secret scan (Gitleaks)
        run: |
          docker run -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --exit-code 1 --verbose

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      # REPORT
      - name: SAST (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config auto

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      # REPORT
      - name: Dependency scan (Trivy)
        run: |
          docker run -v "${{ github.workspace }}:/repo" aquasec/trivy:latest \
            fs --scanners vuln --exit-code 0 /repo

